[package]
name = "ticket_pipeline"
version = "0.2.0"
edition = "2021"
authors = ["Your Team"]
description = "High-performance ticket transfer pipeline between client dashboard and helpcenter"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# HTTP client z connection pooling
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Security
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.21"
rand = "0.8"
hex = "0.4"

# Crypto utilities
uuid = { version = "1.6", features = ["v4", "serde"] }

# Metrics
prometheus = "0.13"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
regex = "1.10"
lazy_static = "1.4"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.5"
mockall = "0.12"
tempfile = "3.9"

[[bin]]
name = "ticket-pipeline"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
