name: Security & Encryption Audit

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/crypto/**'
      - 'src/security.rs'
      - 'Cargo.toml'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # Co tydzień w poniedziałek o 3:00 / Weekly on Monday at 3:00
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── CRYPTO SECURITY AUDIT ─────────────────────────────────
  crypto-audit:
    name: Cryptographic Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Run crypto tests
        run: cargo test crypto:: --verbose

      - name: Generate test encryption key
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV
          echo "SIGNING_KEY=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Test encryption/decryption
        env:
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Encryption Test"
          echo "═══════════════════════════════════════════════"
          ./target/release/ticket-pipeline encrypt --data "Test ticket data" --key "$ENCRYPTION_KEY"

      - name: Test signing/verification
        env:
          SIGNING_KEY: ${{ env.SIGNING_KEY }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Signature Test"
          echo "═══════════════════════════════════════════════"
          SIGNATURE=$(./target/release/ticket-pipeline sign --data "Test data" --key "$SIGNING_KEY" | grep -A1 "Signature:" | tail -1 | xargs)
          ./target/release/ticket-pipeline verify --data "Test data" --signature "$SIGNATURE" --key "$SIGNING_KEY"

      - name: Test vault operations
        env:
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Vault Test"
          echo "═══════════════════════════════════════════════"
          export VAULT_PATH="/tmp/test_vault.json"
          export VAULT_USER="ci_user"
          ./target/release/ticket-pipeline vault store --key-id test-key --data "secret" --name "Test Key"
          ./target/release/ticket-pipeline vault list
          ./target/release/ticket-pipeline vault integrity

      - name: Cleanup vault
        if: always()
        run: rm -f /tmp/test_vault.json

  # ─── KEY ROTATION CHECK ────────────────────────────────────
  key-rotation:
    name: Key Rotation Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Check key rotation status
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Key Rotation Check"
          echo "═══════════════════════════════════════════════"
          ./target/release/ticket-pipeline validate
          echo "✓ Key rotation check completed"

  # ─── CRYPTOGRAPHIC BEST PRACTICES ──────────────────────────
  best-practices:
    name: Cryptographic Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo-audit
        run: |
          cargo install cargo-audit || true
          cargo audit

      - name: Check for weak algorithms
        run: |
          echo "Checking for weak cryptographic algorithms..."
          
          # Check for MD5, SHA1 usage / Sprawdź użycie MD5, SHA1
          if grep -r "md5\|sha1" src/crypto/ --include="*.rs" | grep -v "sha256\|sha512"; then
            echo "✗ Weak algorithm detected!"
            exit 1
          else
            echo "✓ No weak algorithms found"
          fi

      - name: Verify key sizes
        run: |
          echo "Verifying key sizes..."
          
          # Check for proper key sizes / Sprawdź rozmiary kluczy
          if grep -r "16\|24" src/crypto/ --include="*.rs" | grep -i "key\|bytes"; then
            echo "⚠ Potential weak key size detected - manual review needed"
          else
            echo "✓ Key sizes appear adequate"
          fi

      - name: Generate security report
        run: |
          echo "## Security Audit Report" > security-report.md
          echo "- **Date**: $(date '+%Y-%m-%d %H:%M:%S')" >> security-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> security-report.md
          echo "- **Commit**: ${{ github.sha }}" >> security-report.md
          echo "- **Status**: Passed ✓" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30
