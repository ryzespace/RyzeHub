name: Hub Auto-Update + Pipeline Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── ORIGINAL HUB UPDATE ────────────────────────────────────
  update-hub:
    name: Update Hub
    runs-on: ubuntu-latest
    outputs:
      hub-updated: ${{ steps.update.outputs.updated }}
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Set up Python
        run: |
          python3 --version || apt-get update && apt-get install -y python3 python3-pip
          python3 -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt || true
          fi

      - name: Run Hub Update
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN }}
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          if [ -f main.py ]; then
            python3 main.py --org $ORG_NAME --token $GITHUB_TOKEN --dockerize || true
          fi
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Archive Hub Result
        run: |
          mkdir -p artifacts
          if [ -d github_hub ]; then
            cp -r github_hub artifacts/
          fi

  # ─── BUILD RUST PIPELINE ────────────────────────────────────
  build-pipeline:
    name: Build Rust Pipeline
    runs-on: ubuntu-latest
    needs: update-hub
    if: needs.update-hub.outputs.hub-updated == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Cache cargo (manual)
        run: |
          echo "Cargo caching disabled due to organization policy"

      - name: Build release binary
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Upload binary
        run: |
          mkdir -p artifacts
          cp target/release/ticket-pipeline artifacts/ || true

  # ─── RUN PIPELINE SYNC ──────────────────────────────────────
  sync-tickets:
    name: Sync Tickets to HelpCenter
    runs-on: ubuntu-latest
    needs: build-pipeline
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Download binary
        run: |
          mkdir -p bin
          if [ -f artifacts/ticket-pipeline ]; then
            cp artifacts/ticket-pipeline bin/
          else
            echo "Binary not found in artifacts"
          fi

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline || true

      - name: Validate configuration
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: ./bin/ticket-pipeline validate || true

      - name: Health check
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: ./bin/ticket-pipeline health || true

      - name: Run ticket pipeline
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PIPELINE_LOG_LEVEL: info
          AUDIT_LOG_ENABLED: "true"
          CHECKSUM_ENABLED: "true"
        run: ./bin/ticket-pipeline || true

      - name: Upload metrics
        if: always()
        run: ./bin/ticket-pipeline metrics > metrics.txt || true

      - name: Upload artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f metrics.txt ]; then
            cp metrics.txt artifacts/
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Ticket Pipeline sync failed after Hub update!"
