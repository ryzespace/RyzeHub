name: Hub Auto-Update + Pipeline Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HUB_ACTIVE_REPOS: "RyzeSpace.Client,RyzeSpace.HelpCenter"
  HUB_FUTURE_REPOS: "RyzeSpace.AdminPanel,RyzeSpace.Mobile,RyzeSpace.Desktop"

jobs:
  build-pipeline:
    name: Build Rust Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: target/release/ticket-pipeline
          if-no-files-found: error

  update-hub:
    name: Update Hub
    runs-on: ubuntu-latest
    needs: build-pipeline
    outputs:
      hub-updated: ${{ steps.update.outputs.updated }}
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: bin

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Run Hub Update
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN }}
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          ./bin/ticket-pipeline hub \
            --org "$ORG_NAME" \
            --token "$GITHUB_TOKEN" \
            --dir github_hub \
            --dockerize
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Upload hub snapshot
        uses: actions/upload-artifact@v4
        with:
          name: github-hub-snapshot
          path: github_hub
          if-no-files-found: warn

  sync-tickets:
    name: Sync Tickets to HelpCenter
    runs-on: ubuntu-latest
    needs:
      - build-pipeline
      - update-hub
    if: needs.update-hub.outputs.hub-updated == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: bin

      - name: Download hub snapshot
        uses: actions/download-artifact@v4
        with:
          name: github-hub-snapshot
          path: .

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Validate configuration
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: ./bin/ticket-pipeline validate

      - name: Health check
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: ./bin/ticket-pipeline health

      - name: Run ticket pipeline
        env:
          CLIENT_DASHBOARD_URL: ${{ secrets.CLIENT_DASHBOARD_URL }}
          CLIENT_DASHBOARD_API_KEY: ${{ secrets.CLIENT_DASHBOARD_API_KEY }}
          HELPCENTER_URL: ${{ secrets.HELPCENTER_URL }}
          HELPCENTER_API_KEY: ${{ secrets.HELPCENTER_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          PIPELINE_LOG_LEVEL: info
          AUDIT_LOG_ENABLED: "true"
          CHECKSUM_ENABLED: "true"
        run: ./bin/ticket-pipeline

      - name: Export metrics
        if: always()
        run: ./bin/ticket-pipeline metrics > metrics.txt

      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics
          path: metrics.txt
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        run: |
          echo "## Pipeline Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Source repo: RyzeSpace.Client" >> $GITHUB_STEP_SUMMARY
          echo "- Destination repo: RyzeSpace.HelpCenter" >> $GITHUB_STEP_SUMMARY
          echo "- Future targets: $HUB_FUTURE_REPOS" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: echo "::error::Ticket Pipeline sync failed after Hub update!"
