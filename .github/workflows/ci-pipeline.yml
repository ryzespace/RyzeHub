name: CI Pipeline - Rust

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── LINT & FORMAT ──────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env
          rustup component add rustfmt clippy

      - name: Cache cargo (manual)
        run: |
          echo "Cargo caching disabled due to organization policy"

      - name: Check formatting
        run: |
          source $HOME/.cargo/env
          cargo fmt -- --check

      - name: Clippy
        run: |
          source $HOME/.cargo/env
          cargo clippy -- -D warnings

  # ─── BUILD & TEST ───────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Cache cargo
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Run tests
        run: |
          source $HOME/.cargo/env
          cargo test --verbose

      - name: Run tests with coverage
        run: |
          source $HOME/.cargo/env
          cargo install cargo-tarpaulin || true
          cargo tarpaulin --out Xml || true

      - name: Upload test results
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f cobertura.xml ]; then
            cp cobertura.xml artifacts/
          fi
          echo "Test results saved to artifacts/"

  # ─── SECURITY AUDIT ────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Install cargo-audit
        run: |
          source $HOME/.cargo/env
          cargo install cargo-audit

      - name: Run security audit
        run: |
          source $HOME/.cargo/env
          cargo audit

      - name: Check for unused dependencies
        run: |
          source $HOME/.cargo/env
          cargo install cargo-udeps --locked || true
          cargo +nightly udeps || true

  # ─── CROSS-COMPILE ─────────────────────────────────────────
  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/ticket-pipeline artifacts/binary-${{ matrix.target }} || true
          echo "Binary saved to artifacts/"
