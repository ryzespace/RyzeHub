name: Hub Manager - Update Organization Repos

on:
  schedule:
    - cron: '0 */6 * * *'  # Co 6 godzin / Every 6 hours
  workflow_dispatch:
    inputs:
      dockerize:
        description: 'Generate Dockerfiles / Generuj Dockerfile'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── BUILD RUST BINARY ─────────────────────────────────────
  build:
    name: Build Hub Manager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-hub-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: hub-manager-binary
          path: target/release/ticket-pipeline

  # ─── UPDATE HUB ─────────────────────────────────────────────
  update-hub:
    name: Update Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: hub-manager-binary
          path: ./bin/

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Run Hub Update
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN }}
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Hub Update - $(date '+%Y-%m-%d %H:%M:%S')"
          echo "═══════════════════════════════════════════════"
          ./bin/ticket-pipeline hub \
            --org "$ORG_NAME" \
            --token "$GITHUB_TOKEN" \
            --dir github_hub \
            ${{ github.event.inputs.dockerize == 'true' && '--dockerize' || '' }}

      - name: Upload Hub Snapshot
        uses: actions/upload-artifact@v4
        with:
          name: github-hub-snapshot
          path: github_hub/
          retention-days: 7

      - name: Generate Summary
        if: always()
        run: |
          echo "## Hub Update Summary" > $GITHUB_STEP_SUMMARY
          echo "- **Organization**: ${{ secrets.HUB_ORG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerize**: ${{ github.event.inputs.dockerize }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ─── VALIDATE DEPENDENCIES ─────────────────────────────────
  validate-deps:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    needs: update-hub
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: hub-manager-binary
          path: ./bin/

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Analyze Dependencies
        env:
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "Analyzing dependencies in hub..."
          # Get list of repos
          REPOS=$(ls github_hub/ | grep -v "^\." | tr '\n' ',' | sed 's/,$//')
          echo "Found repos: $REPOS"
          
          # Analyze each repo
          for repo in github_hub/*/; do
            if [ -d "$repo" ]; then
              echo ""
              echo "=== Analyzing $(basename $repo) ==="
              ./bin/ticket-pipeline deps --path "$repo" --repos "$REPOS" || true
            fi
          done

  # ─── BUILD ALL DOCKER IMAGES ───────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: update-hub
    if: github.event.inputs.dockerize == 'true'
    strategy:
      matrix:
        repo: [service-a, service-b, lib-core]  # Dostosuj do swoich repo / Adjust to your repos
    steps:
      - uses: actions/checkout@v4

      - name: Download hub snapshot
        uses: actions/download-artifact@v4
        with:
          name: github-hub-snapshot
          path: github_hub/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.repo }}
        if: hashFiles('github_hub/${{ matrix.repo }}/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: github_hub/${{ matrix.repo }}
          push: false
          tags: hub-${{ matrix.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
