name: Hub Manager - Update Organization Repos

on:
  schedule:
    - cron: '0 */6 * * *'  # Co 6 godzin / Every 6 hours
  workflow_dispatch:
    inputs:
      dockerize:
        description: 'Generate Dockerfiles / Generuj Dockerfile'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── BUILD RUST BINARY ─────────────────────────────────────
  build:
    name: Build Hub Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Cache cargo (manual)
        run: |
          echo "Cargo caching disabled due to organization policy"

      - name: Build release
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Upload binary
        run: |
          mkdir -p artifacts
          cp target/release/ticket-pipeline artifacts/ || true

  # ─── UPDATE HUB ─────────────────────────────────────────────
  update-hub:
    name: Update Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Download binary
        run: |
          mkdir -p bin
          if [ -f artifacts/ticket-pipeline ]; then
            cp artifacts/ticket-pipeline bin/
          else
            echo "Binary not found in artifacts"
          fi

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline || true

      - name: Run Hub Update
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN }}
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Hub Update - $(date '+%Y-%m-%d %H:%M:%S')"
          echo "═══════════════════════════════════════════════"
          ./bin/ticket-pipeline hub \
            --org "$ORG_NAME" \
            --token "$GITHUB_TOKEN" \
            --dir github_hub \
            ${{ github.event.inputs.dockerize == 'true' && '--dockerize' || '' }} || true

      - name: Upload Hub Snapshot
        run: |
          mkdir -p artifacts
          if [ -d github_hub ]; then
            cp -r github_hub artifacts/
          fi

      - name: Generate Summary
        if: always()
        run: |
          echo "## Hub Update Summary" > $GITHUB_STEP_SUMMARY
          echo "- **Organization**: ${{ secrets.HUB_ORG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **Dockerize**: ${{ github.event.inputs.dockerize }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # ─── VALIDATE DEPENDENCIES ─────────────────────────────────
  validate-deps:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    needs: update-hub
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Download binary
        run: |
          mkdir -p bin
          if [ -f artifacts/ticket-pipeline ]; then
            cp artifacts/ticket-pipeline bin/
          else
            echo "Binary not found in artifacts"
          fi

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline || true

      - name: Analyze Dependencies
        env:
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "Analyzing dependencies in hub..."
          REPOS=$(ls github_hub/ 2>/dev/null | grep -v "^\." | tr '\n' ',' | sed 's/,$//') || echo ""
          echo "Found repos: $REPOS"
          for repo in github_hub/*/; do
            if [ -d "$repo" ]; then
              echo ""
              echo "=== Analyzing $(basename $repo) ==="
              ./bin/ticket-pipeline deps --path "$repo" --repos "$REPOS" || true
            fi
          done

  # ─── BUILD ALL DOCKER IMAGES ───────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: update-hub
    if: github.event.inputs.dockerize == 'true'
    strategy:
      matrix:
        repo: [service-a, service-b, lib-core]
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Download hub snapshot
        run: |
          if [ -d artifacts/github_hub ]; then
            cp -r artifacts/github_hub github_hub/
          fi

      - name: Set up Docker Buildx
        run: |
          docker buildx version || docker buildx install

      - name: Build Docker image for ${{ matrix.repo }}
        if: hashFiles('github_hub/${{ matrix.repo }}/Dockerfile') != ''
        run: |
          docker buildx build --platform linux/amd64 \
            -t hub-${{ matrix.repo }}:${{ github.sha }} \
            github_hub/${{ matrix.repo }} || true
