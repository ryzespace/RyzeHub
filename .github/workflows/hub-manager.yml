name: Hub Manager - Update Organization Repos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dockerize:
        description: 'Generate Dockerfiles / Generuj Dockerfile'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  HUB_ACTIVE_REPOS: "RyzeSpace.Client,RyzeSpace.HelpCenter"
  HUB_FUTURE_REPOS: "RyzeSpace.AdminPanel,RyzeSpace.Mobile,RyzeSpace.Desktop"
  HUB_MANAGED_REPOS: "RyzeSpace.Client,RyzeSpace.HelpCenter,RyzeSpace.AdminPanel,RyzeSpace.Mobile,RyzeSpace.Desktop"

jobs:
  build:
    name: Build Hub Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: target/release/ticket-pipeline
          if-no-files-found: error

  update-hub:
    name: Update Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: bin

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Run Hub Update
        env:
          GITHUB_TOKEN: ${{ secrets.HUB_GITHUB_TOKEN }}
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Hub Update - $(date '+%Y-%m-%d %H:%M:%S')"
          echo "═══════════════════════════════════════════════"
          DOCKERIZE_FLAG="--dockerize"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dockerize }}" != "true" ]; then
            DOCKERIZE_FLAG=""
          fi
          ./bin/ticket-pipeline hub \
            --org "$ORG_NAME" \
            --token "$GITHUB_TOKEN" \
            --dir github_hub \
            $DOCKERIZE_FLAG

      - name: Upload hub snapshot
        uses: actions/upload-artifact@v4
        with:
          name: github-hub-snapshot
          path: github_hub
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        run: |
          echo "## Hub Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Organization: ${{ secrets.HUB_ORG_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- Active repos: $HUB_ACTIVE_REPOS" >> $GITHUB_STEP_SUMMARY
          echo "- Future targets: $HUB_FUTURE_REPOS" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  validate-deps:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    needs:
      - build
      - update-hub
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ticket-pipeline-binary
          path: bin

      - name: Download hub snapshot
        uses: actions/download-artifact@v4
        with:
          name: github-hub-snapshot
          path: .

      - name: Make binary executable
        run: chmod +x ./bin/ticket-pipeline

      - name: Analyze dependencies
        run: |
          echo "Analyzing dependencies in hub..."
          echo "Tracked repos: $HUB_MANAGED_REPOS"
          for repo in github_hub/*/; do
            if [ -d "$repo" ]; then
              echo ""
              echo "=== Analyzing $(basename "$repo") ==="
              ./bin/ticket-pipeline deps --path "$repo" --repos "$HUB_MANAGED_REPOS"
            fi
          done

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: update-hub
    strategy:
      fail-fast: false
      matrix:
        repo:
          - "RyzeSpace.Client"
          - "RyzeSpace.HelpCenter"
          - "RyzeSpace.AdminPanel"
          - "RyzeSpace.Mobile"
          - "RyzeSpace.Desktop"
    steps:
      - name: Download hub snapshot
        uses: actions/download-artifact@v4
        with:
          name: github-hub-snapshot
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ${{ matrix.repo }}
        run: |
          if [ ! -d "github_hub/${{ matrix.repo }}" ]; then
            echo "Skipping ${{ matrix.repo }} - repository not present in hub snapshot"
            exit 0
          fi
          if [ ! -f "github_hub/${{ matrix.repo }}/Dockerfile" ]; then
            echo "Skipping ${{ matrix.repo }} - Dockerfile not generated"
            exit 0
          fi
          IMAGE_REPO=$(echo "${{ matrix.repo }}" | tr '[:upper:]' '[:lower:]' | tr '.' '-')
          docker buildx build --platform linux/amd64 \
            -t "hub-${IMAGE_REPO}:${{ github.sha }}" \
            github_hub/${{ matrix.repo }}
