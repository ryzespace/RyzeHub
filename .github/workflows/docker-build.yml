name: Docker Build & Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── BUILD & TEST ──────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Cache cargo (manual)
        run: |
          echo "Cargo caching disabled due to organization policy"

      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Test
        run: |
          source $HOME/.cargo/env
          cargo test

  # ─── BUILD DOCKER IMAGE ────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Set up Docker Buildx
        run: |
          docker buildx version || docker buildx install

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker buildx build --platform linux/amd64 -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Test Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} validate || true

  # ─── BUILD MULTI-ARCH ──────────────────────────────────────
  docker-multiarch:
    name: Build Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Set up QEMU
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Set up Docker Buildx
        run: |
          docker buildx version || docker buildx install

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push by digest
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.platform }} \
            --push .

      - name: Export digest
        run: |
          mkdir -p artifacts
          echo "${{ matrix.platform }}" > artifacts/digest-${{ strategy.job-index }}

  # ─── MERGE MANIFESTS ───────────────────────────────────────
  merge:
    name: Merge Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs: docker-multiarch
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Set up Docker Buildx
        run: |
          docker buildx version || docker buildx install

      - name: Log in to Container Registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-linux-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-linux-arm64

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
