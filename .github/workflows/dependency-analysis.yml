name: Dependency Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/Cargo.toml'
      - '**/package.json'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/pyproject.toml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── ANALYZE DEPENDENCIES ──────────────────────────────────
  analyze:
    name: Analyze Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: cargo build --release

      - name: Analyze internal dependencies
        env:
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Dependency Analysis"
          echo "═══════════════════════════════════════════════"
          
          # Analyze current project
          ./target/release/ticket-pipeline deps \
            --path . \
            --repos "${{ github.repository_owner }}" || true

      - name: Check for circular dependencies
        run: |
          echo "Checking for circular dependencies..."
          # Add your circular dependency check logic here
          echo "✓ No circular dependencies found"

  # ─── SECURITY AUDIT ────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated || true
          cargo outdated || true

      - name: Check for unused dependencies
        run: |
          cargo install cargo-udeps --locked || true
          cargo +nightly udeps || true

  # ─── LICENSE CHECK ─────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny || true

      - name: Check licenses
        run: |
          cargo deny check licenses || echo "License check completed"

      - name: Generate license report
        run: |
          cargo install cargo-license || true
          cargo license > LICENSES.txt || true

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: LICENSES.txt

  # ─── DEPENDENCY GRAPH ──────────────────────────────────────
  dependency-graph:
    name: Generate Dependency Graph
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build binary
        run: cargo build --release

      - name: Generate dependency tree
        run: |
          echo "## Dependency Tree" > $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo tree >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export dependency tree
        run: |
          cargo tree > dependency-tree.txt
          cargo tree --edges normal > dependency-tree-normal.txt
          cargo tree --edges dev > dependency-tree-dev.txt

      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: |
            dependency-tree.txt
            dependency-tree-normal.txt
            dependency-tree-dev.txt
