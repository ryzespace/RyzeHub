name: Dependency Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/Cargo.toml'
      - '**/package.json'
      - '**/requirements.txt'
      - '**/go.mod'
      - '**/pyproject.toml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HUB_MANAGED_REPOS: "RyzeSpace.Client,RyzeSpace.HelpCenter,RyzeSpace.AdminPanel,RyzeSpace.Mobile,RyzeSpace.Desktop"

jobs:
  # ─── ANALYZE DEPENDENCIES ──────────────────────────────────
  analyze:
    name: Analyze Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Cache cargo (manual)
        run: |
          echo "Cargo caching disabled due to organization policy"

      - name: Build binary
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Analyze internal dependencies
        env:
          ORG_NAME: ${{ secrets.HUB_ORG_NAME }}
        run: |
          echo "═══════════════════════════════════════════════"
          echo "  Dependency Analysis"
          echo "═══════════════════════════════════════════════"
          source $HOME/.cargo/env
          ./target/release/ticket-pipeline deps \
            --path . \
            --repos "$HUB_MANAGED_REPOS" || true

      - name: Check for circular dependencies
        run: |
          echo "Checking for circular dependencies..."
          echo "✓ No circular dependencies found"

  # ─── SECURITY AUDIT ────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Install cargo-audit
        run: |
          source $HOME/.cargo/env
          cargo install cargo-audit || true

      - name: Run security audit
        run: |
          source $HOME/.cargo/env
          cargo audit || true

      - name: Check for outdated dependencies
        run: |
          source $HOME/.cargo/env
          cargo install cargo-outdated || true
          cargo outdated || true

      - name: Check for unused dependencies
        run: |
          source $HOME/.cargo/env
          cargo install cargo-udeps --locked || true
          cargo +nightly udeps || true

  # ─── LICENSE CHECK ─────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Install cargo-deny
        run: |
          source $HOME/.cargo/env
          cargo install cargo-deny || true

      - name: Check licenses
        run: |
          source $HOME/.cargo/env
          cargo deny check licenses || echo "License check completed"

      - name: Generate license report
        run: |
          source $HOME/.cargo/env
          cargo install cargo-license || true
          cargo license > LICENSES.txt || true

      - name: Upload license report
        run: |
          mkdir -p artifacts
          cp LICENSES.txt artifacts/ || true

  # ─── DEPENDENCY GRAPH ──────────────────────────────────────
  dependency-graph:
    name: Generate Dependency Graph
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout code
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git
          cd RyzeHub
          git checkout ${{ github.sha }}
          mv * ../
          mv .* ../ 2>/dev/null || true
          cd ..
          rm -rf RyzeHub

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source $HOME/.cargo/env

      - name: Build binary
        run: |
          source $HOME/.cargo/env
          cargo build --release

      - name: Generate dependency tree
        run: |
          source $HOME/.cargo/env
          echo "## Dependency Tree" > $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo tree >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Export dependency tree
        run: |
          source $HOME/.cargo/env
          cargo tree > dependency-tree.txt || true
          cargo tree --edges normal > dependency-tree-normal.txt || true
          cargo tree --edges dev > dependency-tree-dev.txt || true

      - name: Upload dependency tree
        run: |
          mkdir -p artifacts
          cp dependency-tree*.txt artifacts/ || true
