name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Keyed on the project and central-package files. The repository intentionally
      # does not commit packages.lock.json, so setup-dotnet's built-in cache (which
      # requires a lock file) cannot be used here.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore RyzeHub.sln

      - name: Build
        run: dotnet build RyzeHub.sln --configuration Release --no-restore

      - name: Verify formatting
        continue-on-error: true
        run: dotnet format RyzeHub.sln --verify-no-changes --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/RyzeHub.UnitTests/RyzeHub.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit.trx"
          --results-directory artifacts/test-results

      - name: Integration tests
        run: >
          dotnet test tests/RyzeHub.IntegrationTests/RyzeHub.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish CLI
        run: dotnet publish src/RyzeHub.Cli/RyzeHub.Cli.csproj -c Release -o artifacts/cli

      # Exported here rather than in `env:` so each run gets fresh key material.
      - name: Generate ephemeral keys
        run: |
          {
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SIGNING_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - name: Help and exit codes
        run: |
          set -euo pipefail
          ./artifacts/cli/ryzehub --help
          # An unknown verb must report a usage error rather than succeeding.
          if ./artifacts/cli/ryzehub definitely-not-a-command > /dev/null 2>&1; then
            echo "::error::Unknown command unexpectedly succeeded"
            exit 1
          fi

      - name: Crypto round trip
        run: |
          set -euo pipefail
          ENVELOPE=$(./artifacts/cli/ryzehub encrypt --data "Test ticket data" | jq -r '.encrypted')
          test -n "$ENVELOPE"
          DECRYPTED=$(./artifacts/cli/ryzehub decrypt --data "$ENVELOPE" | jq -r '.decrypted')
          test "$DECRYPTED" = "Test ticket data"

      - name: Signature round trip
        run: |
          set -euo pipefail
          SIGNATURE=$(./artifacts/cli/ryzehub sign --data "Test data" | jq -r '.signature')
          ./artifacts/cli/ryzehub verify --data "Test data" --signature "$SIGNATURE"
          # A tampered payload must fail verification.
          if ./artifacts/cli/ryzehub verify --data "Tampered" --signature "$SIGNATURE" > /dev/null 2>&1; then
            echo "::error::Signature verification accepted tampered data"
            exit 1
          fi

      - name: Vault operations
        env:
          VAULT_PATH: /tmp/ci-vault.json
          VAULT_USER: ci_user
        run: |
          set -euo pipefail
          ./artifacts/cli/ryzehub vault store --key-id ci-key --data "secret" --name "CI Key"
          ./artifacts/cli/ryzehub vault list | jq -e 'index("ci-key") != null'
          ./artifacts/cli/ryzehub vault integrity | jq -e '.integrityHash | length == 64'
          # The stored secret must never be readable in plaintext on disk.
          if grep -q "secret" /tmp/ci-vault.json; then
            echo "::error::Vault wrote a secret in plaintext"
            exit 1
          fi

      - name: Hub platform exposes 17 modules
        run: |
          set -euo pipefail
          ./artifacts/cli/ryzehub platform snapshot --seed-demo-user ci-user \
            | jq -e '.enabledModules | length == 17'
          ./artifacts/cli/ryzehub platform modules | jq -e 'length == 17'

      - name: Error detection patterns
        run: |
          set -euo pipefail
          ./artifacts/cli/ryzehub errors analyze --message "401 Unauthorized: invalid token" --source ci \
            | jq -e '.category == "Authentication"'
          ./artifacts/cli/ryzehub errors patterns | jq -e 'length >= 6'

      - name: Dependency analysis finds RyzeAuth
        run: |
          set -euo pipefail
          ./artifacts/cli/ryzehub deps --path . | jq -e '.dependencies | index("RyzeAuth") != null'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ci-vault.json

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RyzeHub.Api/Dockerfile
          push: false
          load: true
          tags: ryzehub-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RyzeHub.Cli/Dockerfile
          push: false
          load: true
          tags: ryzehub-cli:ci
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      - name: Smoke test the API container
        run: |
          set -euo pipefail
          docker run -d --name ryzehub-api-ci -p 8082:8082 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:8082 \
            -e RyzeAuth__RequireHttpsMetadata=false \
            -e RyzeAuth__ApiKeyIntrospectionEnabled=false \
            -e RyzeAuth__ForwardAuditEvents=false \
            -e "Security__EncryptionKey=$(openssl rand -base64 32)" \
            ryzehub-api:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://localhost:8082/health/live > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != 1 ]; then
            docker logs ryzehub-api-ci
            exit 1
          fi

          curl --fail --silent http://localhost:8082/api/platform/modules | jq -e 'length == 17'

          # Protected routes must reject anonymous callers.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8082/api/pipeline/run)
          test "$status" = "401" || { echo "::error::Expected 401, got $status"; exit 1; }

      - name: Container diagnostics
        if: always()
        run: docker logs ryzehub-api-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f ryzehub-api-ci || true

      - name: Smoke test the CLI container
        run: docker run --rm ryzehub-cli:ci --help
