name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build RyzeHub.sln --configuration Release
      - name: Test
        run: dotnet test RyzeHub.sln --configuration Release --no-build

  binaries:
    name: Publish binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runtime: [linux-x64, linux-arm64, win-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained CLI
        run: >
          dotnet publish src/RyzeHub.Cli/RyzeHub.Cli.csproj
          -c Release -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/${{ matrix.runtime }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ryzehub-cli-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}
          if-no-files-found: error

  images:
    name: Push container images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/RyzeHub.Api/Dockerfile
          - name: cli
            dockerfile: src/RyzeHub.Cli/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-release

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: images
    environment:
      name: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify RyzeAuth configuration is present
        env:
          RYZEAUTH_AUTHORITY: ${{ secrets.RYZEAUTH_AUTHORITY }}
          RYZEAUTH_API_BASE_URL: ${{ secrets.RYZEAUTH_API_BASE_URL }}
          RYZEAUTH_CLIENT_SECRET: ${{ secrets.RYZEAUTH_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for variable in RYZEAUTH_AUTHORITY RYZEAUTH_API_BASE_URL RYZEAUTH_CLIENT_SECRET ENCRYPTION_KEY; do
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing required secret: $variable"
              missing=1
            fi
          done
          test "$missing" = 0

          case "$RYZEAUTH_AUTHORITY" in
            https://*) echo "RyzeAuth authority uses HTTPS" ;;
            *) echo "::error::RyzeAuth authority must use HTTPS outside development"; exit 1 ;;
          esac

      - name: Deployment summary
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "- Environment: ${{ inputs.environment || 'staging' }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- API image: ${{ env.REGISTRY }}/${{ github.repository }}-api"
            echo "- CLI image: ${{ env.REGISTRY }}/${{ github.repository }}-cli"
            echo "- Identity provider: RyzeAuth (ryzespace realm)"
          } >> "$GITHUB_STEP_SUMMARY"
